<!DOCTYPE html>
<html lang="id" class="bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whoost - Exclusive Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        black: '#050505',
                        zinc: {
                            900: '#121212',
                            800: '#1e1e1e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent !important; outline: none; }
        html, body { background-color: #050505; color: white; font-family: 'Inter', sans-serif; height: 100dvh; margin: 0; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; }
        
        /* Animasi */
        .fade-in-up { animation: fadeInUp 1s ease-out forwards; opacity: 0; transform: translateY(20px); }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
        
        /* Efek Blur Khusus */
        .blur-text { filter: blur(6px); opacity: 0.8; user-select: none; transition: filter 0.3s; }
        .blur-image { filter: blur(15px) grayscale(100%); transform: scale(1.1); }
        
        /* Gradient Monokrom */
        .bg-mono-grad { background: linear-gradient(135deg, #1e1e1e 0%, #050505 100%); }
    </style>
</head>
<body class="antialiased selection:bg-white selection:text-black flex flex-col relative w-full h-full overflow-y-auto">

    <!-- LOADING SCREEN -->
    <div id="pageLoader" class="fixed inset-0 z-[9999] bg-black flex flex-col items-center justify-center transition-opacity duration-700">
        <h1 class="text-4xl font-black text-white tracking-[0.3em] animate-pulse">WHOOST</h1>
        <p class="mt-4 text-zinc-500 text-[10px] font-bold tracking-[0.5em] uppercase">Secured Data</p>
    </div>

    <!-- HEADER -->
    <header class="h-20 flex items-center justify-between px-6 sm:px-10 border-b border-zinc-800/50 bg-black/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-black text-white tracking-widest uppercase">Whoost</h1>
            <div class="h-4 w-px bg-zinc-800"></div>
            <h2 class="text-xs text-zinc-400 font-medium tracking-widest uppercase">Promotional Deck</h2>
        </div>
        <div class="px-3 py-1.5 border border-zinc-700 rounded-full flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
            <span class="text-[10px] font-bold text-white uppercase tracking-wider">Live System</span>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="w-full max-w-7xl mx-auto px-4 sm:px-8 py-10 pb-32">
        
        <!-- 1. HERO STATS (TOP METRICS) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-10 fade-in-up" style="animation-delay: 0.1s;">
            <!-- Card 1 -->
            <div class="bg-mono-grad border border-zinc-800 rounded-3xl p-8 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 blur-[50px] rounded-full"></div>
                <h3 class="text-[11px] font-bold text-zinc-500 uppercase tracking-widest mb-2">Campaign Masuk</h3>
                <h1 class="text-6xl font-black text-white tracking-tighter">13</h1>
            </div>
            <!-- Card 2 -->
            <div class="bg-mono-grad border border-zinc-800 rounded-3xl p-8 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 blur-[50px] rounded-full"></div>
                <h3 class="text-[11px] font-bold text-zinc-500 uppercase tracking-widest mb-2">Total Kreator (Clippers)</h3>
                <h1 class="text-6xl font-black text-white tracking-tighter">1.500<span class="text-3xl text-zinc-600">+</span></h1>
            </div>
            <!-- Card 3 -->
            <div class="bg-mono-grad border border-zinc-800 rounded-3xl p-8 relative overflow-hidden group">
                <div class="absolute top-0 right-0 w-32 h-32 bg-white/5 blur-[50px] rounded-full"></div>
                <h3 class="text-[11px] font-bold text-zinc-500 uppercase tracking-widest mb-2">Video Distribusi</h3>
                <h1 class="text-6xl font-black text-white tracking-tighter">2.200<span class="text-3xl text-zinc-600">+</span></h1>
            </div>
        </div>

        <!-- 2. CHART SECTION (Black & White Style) -->
        <div class="bg-mono-grad border border-zinc-800 rounded-3xl p-8 mb-12 shadow-2xl fade-in-up" style="animation-delay: 0.2s;">
            <div class="flex justify-between items-end mb-6">
                <div>
                    <h2 class="text-2xl font-black text-white tracking-tight">Traffic Pertumbuhan</h2>
                    <p class="text-sm text-zinc-500 mt-1">Volume eksekusi konten dalam 30 hari terakhir</p>
                </div>
            </div>
            <div class="w-full h-56 relative">
                <canvas id="bwChart"></canvas>
            </div>
        </div>

        <!-- 3. CAMPAIGN LIST SECTION -->
        <div class="fade-in-up" style="animation-delay: 0.3s;">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-white tracking-tight uppercase">Data Distribusi Campaign</h2>
                <span class="text-xs text-zinc-500 border border-zinc-800 px-3 py-1 rounded-full">Confidential Data</span>
            </div>

            <!-- GRID KARTU CAMPAIGN -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5" id="campaignGrid">
                <!-- Diisi via JavaScript agar rapi -->
            </div>
        </div>
    </main>

    <!-- SCRIPT DATA & RENDER -->
    <script>
        // Data Campaign berdasarkan permintaan (Nama Asli disimpan di variabel, tapi saat render diblur)
        const campaigns = [
            { client: 'Sefruit Media', status: 'ACTIVE', title: 'OOTD Eps Dustin', rate: 'Rp 1.000', view: '/ 1k view', category: 'Podcast', sisa: '100%' },
            { client: 'Sefruit Media', status: 'ACTIVE', title: 'OOTD Eps Yasmin Karenina', rate: 'Rp 1.000', view: '/ 1k view', category: 'Podcast', sisa: '57%' },
            { client: 'Tanda Tanya Podcast', status: 'ACTIVE', title: 'Tanda Tanya Podcast', rate: 'Rp 2.500', view: '/ 1k view', category: 'Podcast', sisa: '97%' },
            { client: 'Whoost.id', status: 'HOLD', title: 'Inkathh (Pure Matcha Pikulabs)', rate: 'Rp 2.000', view: '/ 1k view', category: 'Brand', sisa: '57%' },
            { client: 'Whoost.id', status: 'HOLD', title: 'Inkathh (Scrub HeyGurl)', rate: 'Rp 2.000', view: '/ 1k view', category: 'Brand', sisa: '39%' },
            { client: 'Whoost.id', status: 'HOLD', title: 'Inkathh (Parfume Positano Allumere)', rate: 'Rp 2.000', view: '/ 1k view', category: 'Brand', sisa: '26%' },
            { client: 'Whoost.id', status: 'PRIVATE ACTIVE', title: 'UGC Topi Miring', rate: 'Rp XXX.XXX', view: '/ 1k view', category: 'Produk Fisik', sisa: 'Terkunci', btn: 'Eksklusif VIP' },
            { client: 'Whoost.id', status: 'PRIVATE ACTIVE', title: 'UGC Iceland Vodka', rate: 'Rp XXX.XXX', view: '/ 1k view', category: 'Produk Fisik', sisa: 'Terkunci', btn: 'Eksklusif VIP' },
            { client: 'Sefruit Media', status: 'CLOSED', title: 'Babydoo', rate: 'Rp 2.000', view: '/ 1k view', category: 'Film', sisa: '0%' },
            { client: 'Sefruit Media', status: 'CLOSED', title: 'Cerita Gue', rate: 'Rp 2.000', view: '/ 1k view', category: 'Podcast', sisa: '0%' },
            { client: 'Sefruit Media', status: 'CLOSED', title: 'Bilik Dosa', rate: 'Rp 2.000', view: '/ 1k view', category: 'Podcast', sisa: '0%' },
            { client: 'Whoost.id', status: 'CLOSED', title: 'Djarum Super Kretek', rate: 'Rp 50.000', view: '/ vid', category: 'Brand', sisa: '0%' },
            { client: 'Whoost.id', status: 'CLOSED', title: 'Shopee Belanja Instant 1 Jam Tiba', rate: 'Rp 2.500', view: '/ 1k view', category: 'Brand', sisa: '0%' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            // Hilangkan Loader
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                loader.classList.add('opacity-0');
                setTimeout(() => loader.style.display = 'none', 700);
            }, 1000);

            // Render Chart B&W
            renderChart();

            // Render Campaign Cards
            renderCampaigns();
        });

        function renderCampaigns() {
            const grid = document.getElementById('campaignGrid');
            let html = '';

            campaigns.forEach((camp, index) => {
                // Menentukan Badge Status B&W
                let statusBadge = '';
                if(camp.status === 'ACTIVE') {
                    statusBadge = `<div class="absolute top-3 left-3 bg-white text-black text-[9px] font-black px-2.5 py-1 rounded-sm uppercase tracking-widest shadow-lg">ACTIVE</div>`;
                } else if(camp.status === 'HOLD') {
                    statusBadge = `<div class="absolute top-3 left-3 bg-zinc-600 text-white text-[9px] font-black px-2.5 py-1 rounded-sm uppercase tracking-widest shadow-lg">HOLD</div>`;
                } else if(camp.status === 'CLOSED') {
                    statusBadge = `<div class="absolute top-3 left-3 bg-zinc-900 border border-zinc-700 text-zinc-500 text-[9px] font-black px-2.5 py-1 rounded-sm uppercase tracking-widest">CLOSED</div>`;
                } else {
                    statusBadge = `<div class="absolute top-3 left-3 bg-black border border-white text-white text-[9px] font-black px-2.5 py-1 rounded-sm uppercase tracking-widest shadow-[0_0_10px_rgba(255,255,255,0.2)] flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg> PRIVATE</div>`;
                }

                // Menentukan Button Acton
                let btnHtml = '';
                if(camp.btn) {
                    btnHtml = `<button class="mt-5 w-full py-2.5 bg-transparent border border-dashed border-white text-white hover:bg-white hover:text-black font-bold text-[11px] uppercase tracking-widest rounded-lg transition-all">Eksklusif VIP</button>`;
                } else if(camp.status === 'CLOSED') {
                    btnHtml = `<button class="mt-5 w-full py-2.5 bg-zinc-900 text-zinc-600 border border-zinc-800 font-bold text-[11px] uppercase tracking-widest rounded-lg cursor-not-allowed">Selesai</button>`;
                } else {
                    btnHtml = `<button class="mt-5 w-full py-2.5 bg-white text-black font-bold text-[11px] uppercase tracking-widest rounded-lg hover:bg-zinc-200 transition-all">Lihat Campaign</button>`;
                }

                // Kalkulasi Bar Budget (Abaikan jika "Terkunci")
                let barWidth = camp.sisa.replace('%', '');
                let barHtml = '';
                if(camp.sisa === 'Terkunci') {
                    barHtml = `
                        <div class="flex justify-between text-[10px] mb-1.5 font-semibold">
                            <span class="text-zinc-500 uppercase tracking-wider">Sisa Budget</span>
                            <span class="text-white flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg> Terkunci</span>
                        </div>
                        <div class="w-full h-1.5 bg-zinc-900 border border-zinc-800 rounded-full overflow-hidden relative">
                            <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTAiIGhlaWdodD0iMTAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHBhdGggZD0iTTAgMTBMMTAgMFpNMTUgMTVMMjUgNVoiIHN0cm9rZT0iIzMzMyIgc3Ryb2tlLXdpZHRoPSIxIi8+PC9zdmc+')]"></div>
                        </div>
                    `;
                } else {
                    barHtml = `
                        <div class="flex justify-between text-[10px] mb-1.5 font-semibold">
                            <span class="text-zinc-500 uppercase tracking-wider">Sisa Budget</span>
                            <span class="text-white">${camp.sisa}</span>
                        </div>
                        <div class="w-full h-1.5 bg-zinc-800 rounded-full overflow-hidden">
                            <div class="h-full bg-white rounded-full shadow-[0_0_10px_rgba(255,255,255,0.8)]" style="width: ${barWidth}%"></div>
                        </div>
                    `;
                }

                // Pseudo random background/image style untuk setiap kartu agar terlihat "ada isinya" yang diblur
                let randGradient = `linear-gradient(${45 * index}deg, #121212, #2a2a2a, #000)`;

                html += `
                <div class="bg-zinc-900/40 border border-zinc-800 rounded-2xl overflow-hidden flex flex-col hover:border-zinc-600 transition-colors">
                    
                    <!-- Feed Image (Blurred) -->
                    <div class="h-28 relative overflow-hidden bg-zinc-900 flex items-center justify-center">
                        <div class="absolute inset-0 blur-image opacity-60" style="background: ${randGradient};"></div>
                        ${statusBadge}
                        <div class="absolute top-3 right-3 bg-black/80 backdrop-blur-md border border-zinc-700 text-zinc-300 text-[9px] font-bold px-2 py-1 rounded uppercase tracking-widest">${camp.category}</div>
                    </div>

                    <!-- Card Body -->
                    <div class="p-5 flex-1 flex flex-col">
                        <div class="text-[9px] text-zinc-500 font-bold uppercase tracking-widest mb-1">${camp.client}</div>
                        
                        <!-- Nama Campaign Diblur -->
                        <div class="text-lg font-black text-white blur-text leading-tight min-h-[3.5rem] flex items-start" title="Data Dirahasiakan">
                            ${camp.title}
                        </div>
                        
                        <!-- Rate -->
                        <div class="mt-3 pb-4 border-b border-zinc-800/80">
                            <div class="text-xl font-black text-white">${camp.rate} <span class="text-[10px] font-medium text-zinc-500 tracking-widest uppercase">${camp.view}</span></div>
                        </div>

                        <!-- Budget Bar -->
                        <div class="mt-4">
                            ${barHtml}
                        </div>

                        ${btnHtml}
                    </div>
                </div>
                `;
            });

            grid.innerHTML = html;
        }

        function renderChart() {
            const ctx = document.getElementById('bwChart').getContext('2d');
            
            // Gradient Putih ke Transparan
            let gradient = ctx.createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.2)'); 
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

            // Data curve eksponensial halus
            const labels = ["W1", "W2", "W3", "W4", "W5", "W6", "W7"];
            const dataPoints = [300, 450, 700, 1100, 1800, 2900, 4500];

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: ' Traffic',
                        data: dataPoints,
                        borderColor: '#ffffff', 
                        backgroundColor: gradient,
                        borderWidth: 3,
                        pointBackgroundColor: '#000000',
                        pointBorderColor: '#ffffff',
                        pointBorderWidth: 2,
                        pointRadius: 4,
                        pointHoverRadius: 6,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 2500,
                        easing: 'easeOutQuart'
                    },
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: {
                        x: {
                            grid: { display: false, drawBorder: false },
                            ticks: { color: '#52525b', font: { family: 'Inter', size: 10, weight: 'bold' } }
                        },
                        y: { display: false, beginAtZero: true }
                    },
                    interaction: { mode: 'index', intersect: false }
                }
            });
        }
    </script>
</body>
</html>
