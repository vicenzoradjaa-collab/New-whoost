    <!-- SCRIPT UTAMA (MODULE) MENGGUNAKAN AUTH.JS -->
    <script type="module">
        import { supabase, enforceRoleProtection } from './authentication/auth.js'; 

        let realEarnings = 0;
        let realWithdrawable = 0;
        let isSensorActive = false;
        
        let analyticsChartInstance = null; 
        
        // Data Global untuk Chart
        let labelsChart = [];
        let dataTotal = [];
        let dataKenaikan = [];
        let currentChartMode = 'total'; // Mode chart aktif ('total' atau 'kenaikan')

        function escapeHTML(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                await enforceRoleProtection();
                await syncDashboardData();
            } catch (error) {
                console.error("Terjadi kesalahan sistem:", error);
            } finally {
                const loader = document.getElementById('pageLoader');
                if (loader) {
                    loader.classList.add('opacity-0'); 
                    setTimeout(() => loader.style.display = 'none', 500); 
                }
            }
        });

        async function syncDashboardData() {
            const { data: { session }, error: sessionError } = await supabase.auth.getSession();
            if (sessionError || !session) {
                window.location.replace('login.html');
                return;
            }
            const userId = session.user.id;
            await Promise.all([
                loadUserStats(userId),
                loadAnalyticsData(userId),
                loadActiveCampaigns(userId)
            ]);
        }

        async function loadUserStats(userId) {
            try {
                const { data, error } = await supabase
                    .from('clipper_stats')
                    .select('*')
                    .eq('user_id', userId)
                    .single();

                if (data && !error) {
                    realEarnings = data.total_earnings || 0;
                    realWithdrawable = data.withdrawable || 0;
                    
                    document.getElementById('total-penghasilan').innerText = formatRupiahK(realEarnings);
                    document.getElementById('bisa-dicairkan').innerText = formatRupiahK(realWithdrawable);
                    document.getElementById('total-views').innerText = formatK(data.total_views || 0);
                    document.getElementById('total-video').innerText = data.total_videos || 0;
                } else {
                    document.getElementById('total-penghasilan').innerText = 'Rp 0';
                    document.getElementById('bisa-dicairkan').innerText = 'Rp 0';
                    document.getElementById('total-views').innerText = '0';
                    document.getElementById('total-video').innerText = '0';
                }
            } catch (err) {
                console.error("Gagal memuat stats:", err);
            }
        }

        // FUNGSI MEMUAT & MENGGENERATE DATA CHART BERDASARKAN RENTANG WAKTU
        function generateChartData(daysCount, endDate = new Date()) {
            labelsChart = [];
            dataTotal = [];
            dataKenaikan = [];
            
            let currentCumulative = 50000; // Base dummy view untuk total awal

            // Mengisi array dari ujung awal hingga akhir
            for (let i = daysCount - 1; i >= 0; i--) {
                const d = new Date(endDate);
                d.setDate(d.getDate() - i);
                labelsChart.push(d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short' }));
                
                let kenaikanHarian = Math.floor(Math.random() * 4000) + 100; // Mock kenaikan view harian
                currentCumulative += kenaikanHarian;

                dataKenaikan.push(kenaikanHarian);
                dataTotal.push(currentCumulative);
            }

            // Jika chart sudah pernah diinisialisasi, update isinya saja (transisi halus)
            if(analyticsChartInstance) {
                analyticsChartInstance.data.labels = labelsChart;
                analyticsChartInstance.data.datasets[0].data = currentChartMode === 'total' ? dataTotal : dataKenaikan;
                analyticsChartInstance.update();
            } else {
                initChart(currentChartMode === 'total' ? dataTotal : dataKenaikan);
                setupChartControls();
            }
        }

        // Fungsi Awal Load Analitik (Default 28 Hari)
        async function loadAnalyticsData(userId) {
            try {
                generateChartData(28, new Date());
            } catch (err) {
                console.error("Gagal memuat data analitik:", err);
            }
        }

        // FUNGSI INIT CHART.JS
        function initChart(datasetToShow) {
            const ctx = document.getElementById('analyticsChart').getContext('2d');
            
            // Efek Gradien Elegan (Putih transparan ke hitam/transparan)
            const gradientFill = ctx.createLinearGradient(0, 0, 0, 300);
            gradientFill.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
            gradientFill.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            // Plugin Custom untuk Garis Vertikal (Crosshair) saat Hover
            const verticalCrosshairPlugin = {
                id: 'verticalCrosshair',
                afterDraw: (chart) => {
                    if (chart.tooltip?._active?.length) {
                        const activePoint = chart.tooltip._active[0];
                        const ctx = chart.ctx;
                        const x = activePoint.element.x;
                        const topY = chart.scales.y.top;
                        const bottomY = chart.scales.y.bottom;

                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(x, topY);
                        ctx.lineTo(x, bottomY);
                        ctx.lineWidth = 1;
                        ctx.strokeStyle = '#52525b'; // zinc-600
                        ctx.setLineDash([5, 5]);
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            };

            if (analyticsChartInstance) {
                analyticsChartInstance.destroy();
            }

            analyticsChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labelsChart,
                    datasets: [{
                        label: 'Views',
                        data: datasetToShow,
                        borderColor: '#ffffff', // Putih elegan
                        backgroundColor: gradientFill,
                        tension: 0.4, 
                        fill: true,
                        borderWidth: 2, 
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#121214', 
                        pointBorderWidth: 2,
                        pointRadius: 0, 
                        pointHoverRadius: 5, 
                        pointHoverBackgroundColor: '#ffffff',
                        pointHoverBorderColor: '#121214',
                        pointHoverBorderWidth: 2,
                        pointHitRadius: 15
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#ffffff', // Background putih ala SaaS modern
                            titleColor: '#000000',
                            bodyColor: '#000000',
                            borderColor: '#e4e4e7', // zinc-200 border
                            borderWidth: 1,
                            padding: { top: 6, bottom: 6, left: 10, right: 10 },
                            displayColors: false, 
                            titleFont: { size: 0 }, // Sembunyikan title date
                            bodyFont: { family: "'Inter', sans-serif", size: 12, weight: '700' },
                            callbacks: {
                                title: () => null, // Hilangkan judul tooltip
                                label: function(context) {
                                    return context.parsed.y.toLocaleString('id-ID') + ' Views';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: '#27272a', // zinc-800
                                borderDash: [4, 4], // Putus-putus
                                drawBorder: false
                            },
                            ticks: {
                                color: '#71717a', 
                                font: { family: "'Inter', sans-serif", size: 10 },
                                maxTicksLimit: window.innerWidth < 600 ? 7 : 14 // Tampilan lebih renggang di HP
                            }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'right', // POSISI KANAN SESUAI REFERENSI
                            grid: {
                                color: '#27272a', 
                                borderDash: [4, 4], 
                                drawBorder: false 
                            },
                            ticks: {
                                color: '#71717a', 
                                font: { family: "'Inter', sans-serif", size: 10 },
                                padding: 10,
                                callback: function(value) {
                                    return value >= 1000 ? (value / 1000) + 'K' : value;
                                }
                            },
                            beginAtZero: true
                        }
                    }
                },
                plugins: [verticalCrosshairPlugin]
            });
        }

        // FUNGSI INTERAKSI BUTTON & DROPDOWN FILTER
        function setupChartControls() {
            const btnTotal = document.getElementById('btn-chart-total');
            const btnKenaikan = document.getElementById('btn-chart-kenaikan');

            // --- Toggle Mode Total vs Kenaikan ---
            btnTotal.addEventListener('click', () => {
                currentChartMode = 'total';
                btnTotal.className = "px-3 py-1 text-[11px] sm:text-xs font-semibold rounded-md bg-white text-black shadow-sm transition-all focus:outline-none";
                btnKenaikan.className = "px-3 py-1 text-[11px] sm:text-xs font-semibold rounded-md text-zinc-400 hover:text-white transition-all focus:outline-none";
                
                analyticsChartInstance.data.datasets[0].data = dataTotal;
                analyticsChartInstance.update();
            });

            btnKenaikan.addEventListener('click', () => {
                currentChartMode = 'kenaikan';
                btnKenaikan.className = "px-3 py-1 text-[11px] sm:text-xs font-semibold rounded-md bg-white text-black shadow-sm transition-all focus:outline-none";
                btnTotal.className = "px-3 py-1 text-[11px] sm:text-xs font-semibold rounded-md text-zinc-400 hover:text-white transition-all focus:outline-none";
                
                analyticsChartInstance.data.datasets[0].data = dataKenaikan;
                analyticsChartInstance.update();
            });

            // --- Logika Custom Dropdown Filter Waktu ---
            const filterBtn = document.getElementById('date-filter-btn');
            const filterMenu = document.getElementById('date-filter-menu');
            const filterText = document.getElementById('date-filter-text');

            // Buka tutup Dropdown saat trigger di klik
            filterBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                filterMenu.classList.toggle('hidden');
                filterMenu.classList.toggle('flex');
            });

            // Klik di luar menutup dropdown
            document.addEventListener('click', (e) => {
                if (!filterMenu.contains(e.target) && !filterBtn.contains(e.target)) {
                    filterMenu.classList.add('hidden');
                    filterMenu.classList.remove('flex');
                }
            });

            // Opsi 7 & 28 Hari (Preset)
            document.querySelectorAll('.date-option').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const days = parseInt(e.target.dataset.days);
                    filterText.innerText = e.target.innerText; // Ubah teks tombol
                    filterMenu.classList.add('hidden');
                    filterMenu.classList.remove('flex');
                    
                    // Generate ulang grafik sesuai jumlah hari, patokan akhir = hari ini
                    generateChartData(days, new Date());
                });
            });

            // --- Logika Flatpickr (Pilih Tanggal) ---
            const flatpickrInstance = flatpickr("#flatpickr-input", {
                mode: "range",
                locale: "id",
                theme: "dark", // Menggunakan tema dark flatpickr
                maxDate: "today",
                onClose: function(selectedDates, dateStr, instance) {
                    if (selectedDates.length === 2) {
                        const start = selectedDates[0];
                        const end = selectedDates[1];
                        
                        // Menghitung selisih hari (+1 agar inklusif)
                        const diffTime = Math.abs(end - start);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                        
                        // Ubah Teks Header Button Menjadi Format "Tanggal A - Tanggal B"
                        filterText.innerText = 
                            start.toLocaleDateString('id-ID', {day: 'numeric', month: 'short'}) + ' - ' + 
                            end.toLocaleDateString('id-ID', {day: 'numeric', month: 'short'});
                            
                        // Panggil ulang generate chart
                        generateChartData(diffDays, end);
                    }
                }
            });

            // Membuka kalender flatpickr
            document.getElementById('date-option-custom').addEventListener('click', () => {
                filterMenu.classList.add('hidden');
                filterMenu.classList.remove('flex');
                flatpickrInstance.open();
            });
        }


        // FUNGSI CAMPAIGN - TANPA DIUBAH SAMA SEKALI
        async function loadActiveCampaigns(userId) {
            const container = document.getElementById('campaign-container');
            try {
                const { data: userCampaigns, error } = await supabase
                    .from('user_campaigns')
                    .select(`
                        campaign_id,
                        campaigns (id, title, brand_name, niche, budget_total, budget_remaining, reward_per_1k, status, type, payment_type, price_per_video, platforms, banner_url, is_private)
                    `)
                    .eq('user_id', userId)
                    .eq('campaigns.status', 'ACTIVE'); 

                if (error) throw error;

                const activeCampaigns = userCampaigns ? userCampaigns.filter(uc => uc.campaigns !== null).map(uc => uc.campaigns) : [];

                if (!activeCampaigns || activeCampaigns.length === 0) {
                    container.innerHTML = `<p class="text-sm text-zinc-500 py-8 px-4">Kamu belum bergabung di campaign yang aktif saat ini.</p>`;
                    return;
                }

                let html = '';
                activeCampaigns.forEach(camp => {
                    const isPrivate = camp.is_private === true;
                    const percentage = camp.budget_total > 0 ? Math.round((camp.budget_remaining / camp.budget_total) * 100) : 0;
                    const price = camp.payment_type === 'video' ? camp.price_per_video : camp.reward_per_1k;
                    const formattedPrice = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(price);
                    const priceLabel = camp.payment_type === 'video' ? '/ video' : '/ 1k views';
                    
                    const safeBrand = escapeHTML(camp.brand_name);
                    const safeTitle = escapeHTML(camp.title);
                    const safeNiche = escapeHTML(camp.niche);
                    const safeBanner = camp.banner_url ? escapeHTML(camp.banner_url) : null;

                    let platformIcons = '';
                    if (camp.platforms && Array.isArray(camp.platforms)) {
                        if (camp.platforms.includes('tiktok')) platformIcons += `<svg class="w-3.5 h-3.5 text-zinc-300" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"/></svg>`;
                        if (camp.platforms.includes('instagram')) platformIcons += `<svg class="w-3.5 h-3.5 text-zinc-300" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.88z"/></svg>`;
                        if (camp.platforms.includes('youtube')) platformIcons += `<svg class="w-3.5 h-3.5 text-zinc-300" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`;
                    }

                    let cardBaseClass = "snap-center flex-shrink-0 w-[280px] md:w-[320px] campaign-card rounded-[1.25rem] md:rounded-[1.5rem] p-3 md:p-4 flex flex-col h-full hover:-translate-y-1 transition-all duration-300 shadow-xl group";
                    if (isPrivate) {
                        cardBaseClass += " bg-gradient-to-br from-zinc-900/90 to-[#0a0a0c] border border-yellow-900/40 hover:border-yellow-700/60";
                    } else {
                        cardBaseClass += " bg-cardBg border border-zinc-800/80 hover:border-zinc-500";
                    }

                    let privateBadge = isPrivate ? `
                        <div class="shrink-0 px-1.5 md:px-2.5 py-0.5 md:py-1 rounded-full border border-yellow-900/50 bg-yellow-900/20 flex items-center gap-1">
                            <svg class="w-2.5 h-2.5 text-yellow-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                            <span class="text-[7px] md:text-[9px] font-bold text-yellow-500 tracking-wider">PRIVATE</span>
                        </div>` : '';

                    const priceColor = isPrivate ? 'text-yellow-400' : 'text-white';

                    const submitBtnClass = isPrivate 
                        ? "w-full bg-gradient-to-r from-yellow-600 to-yellow-500 text-black py-1.5 md:py-2.5 rounded-lg md:rounded-xl font-bold text-[10px] md:text-sm hover:from-yellow-500 hover:to-yellow-400 active:scale-[0.98] transition-all block text-center focus:outline-none shadow-lg shadow-yellow-900/20"
                        : "w-full bg-white text-black py-1.5 md:py-2.5 rounded-lg md:rounded-xl font-bold text-[10px] md:text-sm hover:bg-zinc-200 active:scale-[0.98] transition-all block text-center focus:outline-none";

                    html += `
                    <div class="${cardBaseClass}">
                        <div class="w-full aspect-[16/9] bg-zinc-950 rounded-xl mb-4 flex flex-col items-center justify-center relative overflow-hidden shrink-0 border border-zinc-800/50">
                            ${safeBanner ? `<img src="${safeBanner}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">` : `<span class="text-zinc-600 text-xs font-medium">No Banner</span>`}
                        </div>
                        <div class="flex justify-between items-center mb-2 md:mb-3">
                            <div class="flex items-center overflow-hidden pr-2">
                                <span class="text-[11px] md:text-xs font-bold text-zinc-400 hover:text-white transition truncate">${safeBrand}</span>
                            </div>
                            <div class="flex items-center gap-1.5">
                                ${privateBadge}
                                <div class="shrink-0 px-2 py-0.5 rounded-full border text-[8px] md:text-[9px] font-bold tracking-wider border-green-900/50 bg-green-900/20 text-green-400">ACTIVE</div>
                            </div>
                        </div>
                        <h4 class="text-base md:text-xl font-black text-white mb-2 md:mb-3 truncate group-hover:text-zinc-300 transition-colors" title="${safeTitle}">${safeTitle}</h4>
                        <div class="mb-3 md:mb-4 flex items-baseline gap-1">
                            <span class="text-lg md:text-2xl font-extrabold ${priceColor} tracking-tight">${formattedPrice}</span>
                            <span class="text-zinc-500 text-[9px] md:text-xs font-medium">${priceLabel}</span>
                        </div>
                        <div class="flex flex-wrap items-center gap-2 mb-4">
                            <div class="flex items-center gap-1.5 px-2 py-1 rounded-md border border-zinc-800 bg-zinc-900/50">
                                ${platformIcons || `<span class="text-[10px] text-zinc-600">-</span>`}
                            </div>
                            <div class="flex items-center px-2 py-1 rounded-md border border-zinc-800 bg-zinc-900/80">
                                <span class="text-[8px] md:text-[10px] font-bold text-zinc-300 uppercase tracking-wider">${safeNiche}</span>
                            </div>
                        </div>
                        <div class="mt-auto pt-3 border-t border-zinc-800/50">
                            <div class="flex justify-between items-end mb-1.5 md:mb-2">
                                <span class="text-[9px] md:text-xs text-zinc-400 font-semibold">Budget Tersisa</span>
                                <span class="text-[9px] md:text-xs font-black text-white">${percentage}%</span>
                            </div>
                            <div class="w-full h-1 md:h-1.5 bg-zinc-800 rounded-full overflow-hidden mb-4">
                                <div class="h-full bg-white rounded-full" style="width: ${percentage}%;"></div>
                            </div>
                            <a href="clipper-submit.html?campaign_id=${camp.id}" class="${submitBtnClass}">Submit Video</a>
                        </div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch (err) {
                console.error("Gagal memuat campaign:", err);
                container.innerHTML = `<p class="text-sm text-red-400/80 py-8 px-4">Gagal memuat campaign. Silakan muat ulang halaman.</p>`;
            }
        }

        window.toggleSensor = function() {
            isSensorActive = !isSensorActive;
            const totalElement = document.getElementById('total-penghasilan');
            const cairElement = document.getElementById('bisa-dicairkan');
            const iconElement = document.getElementById('eye-icon');

            if (isSensorActive) {
                totalElement.innerText = 'Rp ••••••';
                cairElement.innerText = 'Rp ••••••';
                iconElement.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                `;
            } else {
                totalElement.innerText = formatRupiahK(realEarnings);
                cairElement.innerText = formatRupiahK(realWithdrawable);
                iconElement.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                `;
            }
        };

        function formatRupiahK(num) {
            if (num >= 1000000000000) return 'Rp ' + (num / 1000000000000).toFixed(1).replace(/\.0$/, '').replace('.', ',') + ' T';
            if (num >= 1000000000) return 'Rp ' + (num / 1000000000).toFixed(1).replace(/\.0$/, '').replace('.', ',') + ' M';
            if (num >= 1000000) return 'Rp ' + (num / 1000000).toFixed(1).replace(/\.0$/, '').replace('.', ',') + ' jt';
            if (num >= 1000) return 'Rp ' + (num / 1000).toFixed(1).replace(/\.0$/, '').replace('.', ',') + ' rb';
            return 'Rp ' + num;
        }

        function formatK(num) {
            if (num >= 1000000000) return (num / 1000000000).toFixed(1).replace(/\.0$/, '').replace('.', ',') + 'B';
            if (num >= 1000000) return (num / 1000000).toFixed(1).replace(/\.0$/, '').replace('.', ',') + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1).replace(/\.0$/, '').replace('.', ',') + 'K';
            return num;
        }
    </script>
