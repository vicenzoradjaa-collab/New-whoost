<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Portofolio & Distribusi - Whoost</title>

    <link rel="icon" type="image/x-icon" href="icon/favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Panggil file Header & Footer -->
    <script src="attribute/header.js"></script>
    <script src="attribute/footer.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0a0a0c',
                        cardBg: '#121214',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body {
            background-color: #0a0a0c;
            color: white;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Custom scrollbar Dropdown & Modal */
        .custom-scroll::-webkit-scrollbar { width: 5px; }
        .custom-scroll::-webkit-scrollbar-track { background: #18181b; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #52525b; }

        /* Utilities */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Animasi Card */
        @keyframes fadeInUpLocal {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up-local {
            opacity: 0;
            animation: fadeInUpLocal 0.6s ease-out forwards;
        }
    </style>
</head>
<body class="antialiased selection:bg-zinc-300 selection:text-black">

    <!-- Header -->
    <custom-header></custom-header>

    <main class="pt-32 pb-24 px-6 max-w-[1400px] mx-auto min-h-screen flex flex-col">
        
        <!-- Header Section -->
        <div class="text-center mb-12" data-aos="fade-up">
            <span class="bg-zinc-900 border border-zinc-800 text-zinc-400 text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-[0.2em] mb-4 inline-block shadow-sm">
                The Impact
            </span>
            <h1 class="text-4xl md:text-6xl font-extrabold mb-4 tracking-tight">
                Skala Viral <br class="md:hidden"> <span class="text-white">Tanpa Batas.</span>
            </h1>
            <p class="text-zinc-400 text-sm md:text-base max-w-2xl mx-auto leading-relaxed">
                Eksplorasi portofolio kreator, brand afiliasi, dan film layar lebar yang berhasil mendominasi FYP berkat jaringan distribusi Whoost.
            </p>
        </div>

        <!-- Top Bar: Search & Filters -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-10 z-40 relative max-w-4xl mx-auto w-full" data-aos="fade-up" data-aos-delay="100">
            
            <!-- Search Bar -->
            <div class="relative w-full md:w-[450px]">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
                <input id="input-search" type="text" placeholder="Cari nama atau username..." class="w-full bg-zinc-900/80 border border-zinc-800 focus:border-zinc-500 focus:bg-zinc-900 rounded-full py-3 pl-12 pr-6 text-sm text-white placeholder-zinc-500 outline-none transition-all shadow-inner">
            </div>

            <!-- Filter Dropdown -->
            <div class="relative inline-block text-left filter-dropdown w-full md:w-auto" id="dropdown-category">
                <button onclick="window.toggleDropdown('filter-dropdown-content')" class="w-full md:w-auto whitespace-nowrap flex items-center justify-between gap-2 bg-zinc-900/80 border border-zinc-800 hover:bg-zinc-800 px-6 py-3 rounded-full text-sm font-semibold transition-colors focus:outline-none">
                    <div class="flex items-center gap-2">
                        <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                        <span id="current-filter-text">Semua Kategori</span>
                    </div>
                    <svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="filter-dropdown-content" class="dropdown-menu custom-scroll hidden absolute right-0 md:left-0 mt-2 w-full md:w-56 max-h-60 overflow-y-auto rounded-xl shadow-xl bg-zinc-900 border border-zinc-700 ring-1 ring-black ring-opacity-5 z-50">
                    <!-- Diisi JS -->
                </div>
            </div>
        </div>

        <!-- Portfolio Grid -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 2xl:grid-cols-5 gap-3 sm:gap-4 md:gap-6 mb-10 min-h-[40vh] relative z-10" id="portfolio-grid">
            <!-- Loading Awal -->
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-zinc-400">
                <svg class="w-10 h-10 animate-spin text-zinc-500 mb-4" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span class="text-xs font-bold tracking-widest uppercase">Menarik Data...</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <custom-footer></custom-footer>

    <!-- ========================================== -->
    <!-- MODAL DETAIL PORTOFOLIO (REDESIGN SPLIT)   -->
    <!-- ========================================== -->
    <div id="detail-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-6 bg-black/90 backdrop-blur-sm opacity-0 invisible transition-all duration-300">
        <div class="absolute inset-0 cursor-pointer" onclick="window.closeModal()"></div> 
        
        <div id="modal-content" class="bg-cardBg border border-zinc-700 w-full max-w-4xl max-h-[90vh] md:min-h-[500px] md:h-[65vh] lg:h-[70vh] rounded-[2rem] overflow-hidden relative shadow-2xl flex flex-col md:flex-row z-10 transform scale-95 transition-transform duration-400 my-auto">
            
            <!-- Tombol Close -->
            <button onclick="window.closeModal()" class="absolute top-4 right-4 z-50 w-10 h-10 bg-black/50 backdrop-blur border border-zinc-700 hover:bg-zinc-700 rounded-full flex items-center justify-center transition-colors text-zinc-300 hover:text-white focus:outline-none shadow-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>

            <!-- KIRI: Poster -->
            <div class="w-full md:w-[40%] lg:w-[45%] h-[350px] md:h-full bg-zinc-950 relative shrink-0">
                <img id="modal-poster" src="" class="absolute inset-0 w-full h-full object-cover shadow-[inset_0_-50px_50px_rgba(0,0,0,0.5)]">
                <!-- Gradasi transisi untuk mobile -->
                <div class="absolute inset-0 bg-gradient-to-t from-cardBg via-transparent to-transparent md:hidden"></div>
            </div>

            <!-- KANAN: Keterangan -->
            <div class="w-full md:w-[60%] lg:w-[55%] p-6 md:p-8 lg:p-10 flex flex-col overflow-y-auto custom-scroll relative z-20 -mt-10 md:mt-0">
                
                <div class="mb-5">
                    <span id="modal-niche" class="inline-block px-3 py-1 bg-zinc-900 border border-zinc-700 text-zinc-300 text-[10px] font-bold uppercase tracking-wider rounded-md mb-3 shadow-sm">Kategori</span>
                    <h3 id="modal-title" class="text-3xl md:text-4xl lg:text-5xl font-extrabold text-white leading-tight mb-4 tracking-tight drop-shadow-sm">Nama Item</h3>
                    
                    <!-- DAFTAR AKUN / BADGE SOSMED DI BAWAH NAMA -->
                    <div id="modal-handles-container" class="flex flex-wrap items-center gap-2">
                        <!-- Diisi via JS -->
                    </div>
                </div>

                <!-- TENTANG KREATOR / CAMPAIGN -->
                <div class="mb-8 flex-grow">
                    <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mb-3">Tentang Campaign / Kreator</p>
                    <p id="modal-desc" class="text-zinc-300 text-[13px] md:text-sm leading-relaxed whitespace-pre-line"></p>
                </div>

                <!-- STATS & DISTRIBUSI (BAGIAN BAWAH) -->
                <div class="pt-5 border-t border-zinc-800/60 grid grid-cols-2 gap-4 shrink-0 mt-auto">
                    <div>
                        <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mb-1.5">Total Views</p>
                        <p id="modal-stats" class="text-lg md:text-xl font-black text-white"></p>
                    </div>
                    <div>
                        <p class="text-[10px] text-zinc-500 font-bold uppercase tracking-widest mb-1.5">Distribusi Platform</p>
                        <div id="modal-platforms" class="flex items-center gap-2 mt-1">
                            <!-- Diisi via JS -->
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <!-- ========================================== -->
    <!-- JAVASCRIPT & SUPABASE LOGIC                -->
    <!-- ========================================== -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module">
        import { supabase } from './authentication/auth.js';

        let dbPortfolio = []; 
        let currentFilter = 'All';
        let searchQuery = '';
        let displayCounter = 0; 
        
        const gridContainer = document.getElementById('portfolio-grid');
        const filterDropdownContent = document.getElementById('filter-dropdown-content');
        const currentFilterText = document.getElementById('current-filter-text');

        // Initialize AOS
        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({ once: true, offset: 50, duration: 800 });
            fetchInitialData();
        });

        // Toggle Filter Dropdown
        window.toggleDropdown = function(id) {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        };
        
        window.addEventListener('click', function(e) {
            if (!e.target.closest('.filter-dropdown')) {
                filterDropdownContent.classList.add('hidden');
            }
        });

        // 1. PENGAMBILAN DATA DARI SUPABASE
        async function fetchInitialData() {
            try {
                // Fetch Portfolios saja
                const { data: portData, error: portErr } = await supabase
                    .from('portfolios')
                    .select('*')
                    .order('name', { ascending: true });
                
                if (portErr) throw portErr;
                dbPortfolio = portData || [];
                
                renderFilters();
                updateDisplay();

            } catch (error) {
                console.error("Error fetching data:", error);
                gridContainer.innerHTML = `<div class="col-span-full text-center py-10 text-red-500 font-medium">Gagal memuat data dari database. Pastikan koneksi internet stabil.</div>`;
            }
        }

        // 2. RENDER FILTER KATEGORI
        function renderFilters() {
            const uniqueCategories = [...new Set(dbPortfolio.map(item => item.category))];
            const allCats = ['All', ...uniqueCategories];

            filterDropdownContent.innerHTML = `<div class="py-1">` + allCats.map(c => `
                <button onclick="window.applyFilter('${c}')" class="text-zinc-300 hover:bg-zinc-800 hover:text-white block px-4 py-2.5 text-sm w-full text-left font-medium transition-colors flex justify-between items-center focus:outline-none">
                    ${c === 'All' ? 'Semua Kategori' : c}
                    <svg class="w-4 h-4 text-zinc-400 ${currentFilter === c ? 'opacity-100' : 'opacity-0'}" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                </button>
            `).join('') + `</div>`;
        }

        window.applyFilter = function(filterName) {
            currentFilter = filterName;
            currentFilterText.textContent = filterName === 'All' ? 'Semua Kategori' : filterName;
            filterDropdownContent.classList.add('hidden');
            renderFilters(); 
            updateDisplay();
        }

        // 3. SEARCH & UPDATE DISPLAY GRID
        document.getElementById('input-search').addEventListener('input', (e) => { 
            searchQuery = e.target.value.toLowerCase(); 
            updateDisplay(); 
        });

        async function updateDisplay() {
            displayCounter++;
            const currentCounter = displayCounter;

            const filteredData = dbPortfolio.filter(item => {
                const matchCategory = currentFilter === 'All' || item.category === currentFilter;
                const matchSearch = item.name.toLowerCase().includes(searchQuery) || 
                                    (item.handles && item.handles.some(h => h.username.toLowerCase().includes(searchQuery)));
                return matchCategory && matchSearch;
            });

            if (filteredData.length > 0) {
                gridContainer.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20">
                        <svg class="w-8 h-8 animate-spin text-zinc-600 mb-3" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span class="text-[10px] text-zinc-500 font-bold tracking-widest uppercase">Menyiapkan Gambar...</span>
                    </div>`;
                
                // Preload Gambar Utama (Portrait)
                const imageUrls = filteredData.map(i => i.portraitImg).filter(Boolean);
                await Promise.all(imageUrls.map(url => new Promise(res => {
                    const img = new Image(); img.onload = res; img.onerror = res; img.src = url;
                })));
            }

            if (currentCounter === displayCounter) {
                renderGrid(filteredData);
            }
        }

        function renderGrid(dataToRender) {
            gridContainer.innerHTML = ""; 
            if (dataToRender.length === 0) {
                gridContainer.innerHTML = `
                    <div class="col-span-full text-center py-16">
                        <svg class="w-16 h-16 text-zinc-700 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        <h3 class="text-xl font-bold text-white mb-2">Tidak Ditemukan</h3>
                        <p class="text-zinc-500 text-sm">Coba ubah kata kunci atau ganti filter kategori.</p>
                    </div>`;
                return;
            }

            dataToRender.forEach((item, index) => {
                const delay = (index % 10) * 50;
                const safeNiche = item.niche || item.category;

                gridContainer.innerHTML += `
                    <div onclick="window.openModal('${item.id}', this)" class="bg-cardBg border border-zinc-800/80 hover:border-zinc-500 rounded-[1.25rem] md:rounded-[1.5rem] p-3 md:p-4 flex flex-col transition-all duration-300 shadow-xl group hover:-translate-y-1 cursor-pointer animate-fade-in-up-local" style="animation-delay: ${delay}ms;">
                        
                        <div class="w-full relative aspect-[3/4] rounded-lg md:rounded-xl overflow-hidden bg-zinc-950 mb-3 border border-zinc-800/50 shrink-0">
                            <img src="${item.portraitImg}" class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                            
                            <!-- Badge Pojok Kanan Atas -->
                            <div class="absolute top-3 right-3 z-10">
                                <span class="bg-zinc-900/80 backdrop-blur-sm border border-zinc-700 text-[9px] md:text-[10px] font-bold text-zinc-300 uppercase tracking-widest px-2 py-1 rounded-md shadow-md">${safeNiche}</span>
                            </div>
                        </div>
                        
                        <h3 class="font-bold text-sm md:text-base text-white group-hover:text-zinc-300 leading-tight mb-1.5 truncate transition-colors">${item.name}</h3>
                        
                        <!-- Total Views Tepat di bawah nama -->
                        <div class="text-[11px] md:text-xs text-zinc-400 font-medium mb-3 flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            ${item.stats}
                        </div>
                        
                        <div class="mt-auto pt-3 border-t border-zinc-800/50 flex justify-between items-center">
                            <span class="text-[10px] md:text-xs text-zinc-500 font-semibold">Lihat Detail</span>
                            <div class="w-6 h-6 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center group-hover:bg-white group-hover:text-black transition-colors">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        </div>
                    </div>
                `;
            });
        }


        // 4. FUNGSI MODAL DETAIL (Split Layout)
        const modal = document.getElementById('detail-modal');
        const modalContent = document.getElementById('modal-content');
        const posterImg = document.getElementById('modal-poster');

        window.openModal = async function(id, cardElement) {
            const data = dbPortfolio.find(i => i.id === id);
            if (!data) return;

            // Efek Loading di Card
            const cardSpinner = document.createElement('div');
            cardSpinner.className = "absolute inset-0 bg-black/60 z-50 flex items-center justify-center backdrop-blur-sm rounded-[1.25rem] transition-all";
            cardSpinner.innerHTML = `<svg class="w-8 h-8 animate-spin text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            if (cardElement) { cardElement.style.position = 'relative'; cardElement.appendChild(cardSpinner); }

            // Set & Preload Poster Image
            posterImg.src = '';
            await new Promise(res => {
                const img = new Image();
                img.onload = () => { posterImg.src = data.portraitImg; res(); };
                img.onerror = () => { res(); }; 
                img.src = data.portraitImg;
            });
            
            if (cardElement) cardSpinner.remove();

            // Isi Data Teks Kanan
            document.getElementById('modal-title').textContent = data.name;
            document.getElementById('modal-niche').textContent = data.category;
            document.getElementById('modal-desc').textContent = data.desc;
            document.getElementById('modal-stats').textContent = data.stats;

            // Logika untuk Social Media Handles & Hitung Platform Distribusi
            const handlesContainer = document.getElementById('modal-handles-container');
            const platformContainer = document.getElementById('modal-platforms');
            handlesContainer.innerHTML = '';
            platformContainer.innerHTML = '';
            let platforms = new Set();

            if(data.handles && Array.isArray(data.handles) && data.handles.length > 0) {
                data.handles.forEach(handle => {
                    const linkStr = (handle.link || '').toLowerCase(); 
                    
                    let iconHTML = `<svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/></svg>`;
                    
                    if (linkStr.includes('instagram.com')) {
                        platforms.add('instagram');
                        iconHTML = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.88z"/></svg>`;
                    } else if (linkStr.includes('tiktok.com')) {
                        platforms.add('tiktok');
                        iconHTML = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"/></svg>`;
                    } else if (linkStr.includes('youtube.com') || link.includes('youtu.be')) {
                        platforms.add('youtube');
                        iconHTML = `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`;
                    }

                    handlesContainer.innerHTML += `
                        <a href="${handle.link}" target="_blank" class="bg-zinc-800 border border-zinc-700 hover:bg-zinc-700 hover:border-zinc-500 text-zinc-300 hover:text-white px-2.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors shadow-sm focus:outline-none">
                            ${iconHTML} ${handle.username}
                        </a>
                    `;
                });
            } else {
                handlesContainer.innerHTML = '<span class="text-xs text-zinc-500">-</span>';
            }

            // Memasukkan Icon Distribusi Platform (Hitam Putih Theme)
            if (platforms.size === 0) {
                platformContainer.innerHTML = '<span class="text-xs text-zinc-500 font-medium">-</span>';
            } else {
                platforms.forEach(p => {
                    let svg = '';
                    if (p === 'tiktok') {
                        svg = `<svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"/></svg>`;
                    } else if (p === 'instagram') {
                        svg = `<svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.88z"/></svg>`;
                    } else if (p === 'youtube') {
                        svg = `<svg class="w-4 h-4 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`;
                    }
                    
                    platformContainer.innerHTML += `
                        <div class="w-8 h-8 rounded-full bg-zinc-800 border border-zinc-700 flex items-center justify-center shadow-inner" title="${p}">
                            ${svg}
                        </div>
                    `;
                });
            }

            // Tampilkan Modal
            modal.classList.remove('invisible');
            modal.classList.add('opacity-100');
            modalContent.classList.remove('scale-95');
            document.body.style.overflow = 'hidden'; 
        }

        window.closeModal = function() { 
            modal.classList.remove('opacity-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => { 
                modal.classList.add('invisible'); 
                document.body.style.overflow = 'auto'; 
            }, 300); 
        };

    </script>
</body>
</html>
