    <!-- AREA KONTEN UTAMA -->
    <main class="flex-1 overflow-y-auto overflow-x-hidden px-4 sm:px-8 pt-6 pb-32 z-0 scroll-smooth w-full relative">
        
        <!-- EMPTY STATE (Disembunyikan secara default) -->
        <div id="emptyState" class="hidden flex-col items-center justify-center pt-20 pb-10 px-4 text-center">
            <div class="w-32 h-32 bg-zinc-900 border border-zinc-800 rounded-full flex items-center justify-center mb-6 relative">
                <svg class="w-12 h-12 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 001.5-1.5V6a1.5 1.5 0 00-1.5-1.5H3.75A1.5 1.5 0 002.25 6v12a1.5 1.5 0 001.5 1.5zm10.5-11.25h.008v.008h-.008V8.25zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                </svg>

            <h2 class="text-lg sm:text-xl font-semibold text-white mb-2">Belum ada konten kampanye</h2>
            <p class="text-[13px] sm:text-[14px] text-zinc-500 max-w-md mx-auto">Konten dari kreator untuk platform/kampanye ini akan muncul di sini setelah Anda menyetujuinya.</p>
        </div>

        <!-- GRID KARTU (Dinamis dari Supabase) -->
        <div id="contentGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7 gap-3 sm:gap-5 w-full transition-opacity duration-300">
            <!-- Kartu akan dimasukkan via JavaScript -->
        </div>

    </main>

    <!-- SCRIPT & LOGIKA SUPABASE -->
    <script>
        const ACTIVE_MENU = 'konten'; 
    </script>
    <script src="attribute/navbarclient.js"></script>

    <script type="module">
        // 1. IMPORT PROTEKSI DARI AUTH.JS
        import { supabase, enforceRoleProtection } from './authentication/auth.js';

        let sessionUser = null;
        let campaignsData = [];
        let submissionsData = [];
        let currentCampaign = "Semua Kampanye";
        let currentPlatform = "Semua";

        // 2. FUNGSI ANTI-XSS
        function escapeHTML(str) {
            if (!str) return '';
            return str.toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // 3. JALANKAN PROTEKSI PERTAMA KALI
                await enforceRoleProtection();

                // 4. Cek Sesi
                const { data: { session }, error: sessionError } = await supabase.auth.getSession();
                if (sessionError || !session) {
                    window.location.replace('login.html');
                    return;
                }
                sessionUser = session.user;

                // 5. Ambil Kampanye (Untuk Filter Dropdown menggunakan .ilike)
                const { data: camps, error: campError } = await supabase
                    .from('campaigns')
                    .select('id, title')
                    .ilike('client_id', `%${sessionUser.id}%`)
                    .order('created_at', { ascending: false });

                if (campError) throw campError;
                if (camps) campaignsData = camps;

                renderCampaignDropdown();

                // 6. Ambil Konten (Submissions) yang APPROVED beserta kolom is_private
                if (campaignsData.length > 0) {
                    const campIds = campaignsData.map(c => c.id);
                    const { data: subs, error: subError } = await supabase
                        .from('submissions')
                        .select('*, campaigns(title, is_private), profiles(full_name, business_name)')
                        .in('campaign_id', campIds)
                        .eq('status', 'APPROVED')
                        .order('created_at', { ascending: false });

                    if (subError) throw subError;
                    if (subs) submissionsData = subs;
                }

                // 7. Render Grid
                renderGrid();

            } catch (error) {
                console.error("Initialization error:", error);
                document.getElementById('contentGrid').innerHTML = '<p class="text-red-500 col-span-full">Gagal memuat data dari database.</p>';
            } finally {
                // 8. Sembunyikan Loader AMAN DALAM FINALLY
                setTimeout(() => {
                    const loader = document.getElementById('pageLoader');
                    if (loader) {
                        loader.classList.add('opacity-0');
                        setTimeout(() => loader.style.display = 'none', 500);
                    }
                }, 800); 
            }
        });

        // ==========================================
        // FUNGSI BANTUAN (UTILITIES) & METADATA VIDEO
        // ==========================================

        function formatK(num) {
            if(num >= 1000000) return (num/1000000).toFixed(1).replace(/\.0$/, '') + 'M';
            if(num >= 1000) return (num/1000).toFixed(1).replace(/\.0$/, '') + 'K';
            return num.toString();
        }

        function getPlatformType(url) {
            if(!url) return 'Lainnya';
            url = url.toLowerCase();
            if (url.includes('tiktok.com')) return 'TikTok';
            if (url.includes('instagram.com')) return 'Instagram';
            if (url.includes('youtube.com') || url.includes('youtu.be')) return 'YouTube';
            return 'Lainnya';
        }

        // FUNGSI BARU: Untuk menghasilkan metadata platform dan URL thumbnail
        function getVideoMeta(url) {
            url = url || '';
            let platHTML = `<svg class="w-3 h-3 sm:w-4 sm:h-4 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>`;
            let thumbUrl = 'https://placehold.co/400x600/121214/27272a?text=Memuat+Video...';
            
            if (url.includes('tiktok.com')) {
                platHTML = `<svg class="w-3 h-3 sm:w-4 sm:h-4 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"/></svg>`;
                thumbUrl = 'https://placehold.co/400x600/121214/27272a?text=Memuat+TikTok...';
            } else if (url.includes('instagram.com')) {
                platHTML = `<svg class="w-3 h-3 sm:w-4 sm:h-4 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 1 0 0 12.324 6.162 6.162 0 0 0 0-12.324zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.406-11.845a1.44 1.44 0 1 0 0 2.881 1.44 1.44 0 0 0 0-2.88z"/></svg>`;
                thumbUrl = 'https://placehold.co/400x600/121214/27272a?text=Memuat+Reels...';
            } else if (url.match(/(?:youtu\.be\/|youtube\.com\/)/)) {
                platHTML = `<svg class="w-3 h-3 sm:w-4 sm:h-4 text-white" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>`;
                let ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|shorts\/|watch\?v=|watch\?.+&v=))((\w|-){11})/);
                if (ytMatch && ytMatch[1]) thumbUrl = `https://img.youtube.com/vi/${ytMatch[1]}/hqdefault.jpg`;
            }
            return { platHTML, thumbUrl };
        }

        // ==========================================
        // ASYNC SCRAPER THUMBNAIL DINAMIS
        // ==========================================
        async function extractThumbnailsAsync(items) {
            for (let sub of items) {
                const imgEl = document.getElementById(`thumb-${sub.id}`);
                if (!imgEl || imgEl.getAttribute('data-loaded') === 'true') continue;
                
                const url = sub.video_link;
                if (!url) continue;

                if (url.match(/(?:youtu\.be\/|youtube\.com\/)/)) {
                    // Karena URL thumbnail default (hqdefault.jpg) sudah dihandle getMetaVideo
                    imgEl.setAttribute('data-loaded', 'true');
                    continue;
                }

                // Scrape IG & TikTok Thumbnails via API
                try {
                    const res = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
                    const json = await res.json();
                    
                    if (json.status === 'success' && json.data && json.data.image && json.data.image.url) {
                        imgEl.src = json.data.image.url;
                        imgEl.setAttribute('data-loaded', 'true');
                    } else if (url.includes('tiktok.com')) {
                        const tkRes = await fetch(`https://www.tikwm.com/api/?url=${url}`);
                        const tkJson = await tkRes.json();
                        if (tkJson.data && tkJson.data.cover) {
                            imgEl.src = tkJson.data.cover;
                            imgEl.setAttribute('data-loaded', 'true');
                        }
                    }
                } catch(e) {}
            }
        }

        // ==========================================
        // RENDER FUNGSI (UI GENERATOR)
        // ==========================================

        function renderCampaignDropdown() {
            const dropdown = document.getElementById('dropdownCampaignList');
            let html = `<button onclick="window.selectCampaign('Semua Kampanye', 'Semua Kampanye')" class="w-full text-left px-5 py-3 text-[13px] sm:text-[14px] hover:bg-zinc-800 transition-colors">Semua Kampanye</button>`;
            
            campaignsData.forEach(c => {
                // Sanitasi saat merender ke dalam list menu
                const safeTitle = escapeHTML(c.title);
                html += `<button onclick="window.selectCampaign('${c.id}', '${safeTitle.replace(/'/g, "\\'")}')" class="w-full text-left px-5 py-3 text-[13px] sm:text-[14px] hover:bg-zinc-800 transition-colors border-t border-zinc-800/50">${safeTitle}</button>`;
            });

            dropdown.innerHTML = html;
        }

        function renderGrid() {
            const grid = document.getElementById('contentGrid');
            const emptyState = document.getElementById('emptyState');
            
            grid.classList.add('opacity-0');

            setTimeout(() => {
                let htmlContent = '';
                let visibleCount = 0;
                let renderedSubs = [];

                submissionsData.forEach(sub => {
                    const campId = sub.campaign_id;
                    const platform = getPlatformType(sub.video_link);

                    // Filter
                    const matchPlatform = (currentPlatform === 'Semua' || platform === currentPlatform);
                    const matchCampaign = (currentCampaign === 'Semua Kampanye' || campId === currentCampaign);

                    if (matchPlatform && matchCampaign) {
                        visibleCount++;
                        renderedSubs.push(sub);

                        const views = Math.max(sub.views_claimed || 0, sub.views_paid || 0, sub.views || 0);
                        const meta = getVideoMeta(sub.video_link);
                        
                        // 9. SANITASI XSS PADA INFORMASI CARD
                        const rawCreatorName = sub.profiles?.business_name || sub.profiles?.full_name || 'Kreator Whoost';
                        const creatorName = escapeHTML(rawCreatorName).replace(/\s+/g, '').toLowerCase();
                        const campTitle = escapeHTML(sub.campaigns?.title || 'Kampanye');
                        const safeUrl = encodeURI(sub.video_link || '');
                        const isPrivate = sub.campaigns?.is_private === true;

                        // Penentuan Style khusus Private vs Public Card
                        let cardBaseClass = "p-1.5 sm:p-2 rounded-2xl overflow-hidden transition-all duration-300 flex flex-col group ";
                        if (isPrivate) {
                            cardBaseClass += "bg-gradient-to-br from-zinc-900/90 to-[#0a0a0c] border border-yellow-900/40 hover:border-yellow-700/60";
                        } else {
                            cardBaseClass += "bg-cardBg border border-zinc-800 hover:border-zinc-500";
                        }
                        
                        htmlContent += `
                            <div class="${cardBaseClass}">
                                <div class="relative w-full aspect-[3/4] bg-zinc-900 rounded-xl overflow-hidden shrink-0 group">
                                    <img id="thumb-${sub.id}" data-video-link="${safeUrl}" src="${meta.thumbUrl}" alt="Thumbnail" class="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-500">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent z-0 pointer-events-none"></div>
                                    
                                    <!-- Badge Platform Kiri Atas -->
                                    <div class="absolute top-2 left-2 sm:top-3 sm:left-3 flex flex-col gap-1.5 items-start z-20 pointer-events-none">
                                        <div class="bg-white/10 backdrop-blur-md border border-white/20 p-1 sm:p-1.5 rounded-lg flex items-center justify-center shadow-sm">
                                            ${meta.platHTML}
                                        </div>
                                    </div>
                                    
                                    <!-- Badge Views Kanan Atas -->
                                    <div class="absolute top-2 right-2 sm:top-3 sm:right-3 bg-black/60 backdrop-blur-md border border-white/10 px-1.5 sm:px-2 py-0.5 rounded flex items-center gap-1 shadow-sm z-20 pointer-events-none">
                                        <svg class="w-2.5 h-2.5 sm:w-3 sm:h-3 text-white flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                                        <span class="text-[8px] sm:text-[10px] font-semibold text-white">${formatK(views)}</span>
                                    </div>
                                    
                                    <!-- Info Creator -->
                                    <div class="absolute bottom-2 left-2 right-2 sm:bottom-3 sm:left-3 sm:right-3 overflow-hidden z-10 pointer-events-none">
                                        <p class="text-[11px] sm:text-sm font-bold text-white truncate">@${creatorName}</p>
                                        <p class="text-[8px] sm:text-[9px] text-zinc-400 mt-0.5 truncate w-full" title="${campTitle}">${campTitle}</p>
                                    </div>
                                </div>
                                <!-- Action Button (Membuka link asli konten) -->
                                <div class="flex-1 flex flex-col justify-end mt-1.5 sm:mt-2">
                                    <a href="${safeUrl}" target="_blank" class="w-full flex items-center justify-center gap-1.5 py-1.5 sm:py-2.5 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded-lg text-[10px] sm:text-[13px] font-medium text-zinc-300 hover:text-white transition-colors focus:outline-none shadow-sm">
                                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                        Lihat Video
                                    </a>
                                </div>
                            </div>
                        `;
                    }
                });

                grid.innerHTML = htmlContent;

                if (visibleCount === 0) {
                    grid.classList.add('hidden');
                    grid.classList.remove('grid');
                    emptyState.classList.remove('hidden');
                    emptyState.classList.add('flex');
                } else {
                    grid.classList.remove('hidden');
                    grid.classList.add('grid');
                    emptyState.classList.add('hidden');
                    emptyState.classList.remove('flex');
                }

                grid.classList.remove('opacity-0');

                // Jalankan fungsi pengambil Thumbnail
                if (renderedSubs.length > 0) {
                    extractThumbnailsAsync(renderedSubs);
                }
            }, 200);
        }

        // ==========================================
        // UI BINDINGS
        // ==========================================
        
        window.toggleCampaignFilter = function() {
            const dropdown = document.getElementById('dropdownCampaign');
            dropdown.classList.toggle('hidden');
            dropdown.classList.toggle('flex');
        }

        window.selectCampaign = function(id, textName) {
            currentCampaign = id;
            document.getElementById('campaignLabel').innerText = textName;
            window.toggleCampaignFilter();
            renderGrid();
        }

        // Tutup dropdown jika klik di luar
        window.addEventListener('click', function(e) {
            const btn = document.getElementById('btnCampaign');
            const dropdown = document.getElementById('dropdownCampaign');
            if(btn && dropdown) {
                if (!btn.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.add('hidden');
                    dropdown.classList.remove('flex');
                }
            }
        });

        window.setPlatform = function(platform) {
            currentPlatform = platform;
            
            // Reset style semua tab
            const tabs = document.querySelectorAll('.platform-tab');
            tabs.forEach(tab => {
                tab.className = "platform-tab flex-shrink-0 flex items-center gap-2 px-4 sm:px-5 py-2 rounded-full text-[13px] sm:text-[14px] font-medium transition-all duration-300 bg-transparent text-zinc-400 border border-zinc-800 hover:text-white hover:border-zinc-600";
            });

            // Set style tab aktif
            const activeTab = document.getElementById(`tab-${platform}`);
            if(activeTab) {
                if(platform === 'Semua'){
                     activeTab.className = "platform-tab flex-shrink-0 px-4 sm:px-6 py-2 rounded-full text-[13px] sm:text-[14px] font-semibold transition-all duration-300 bg-white text-black shadow-[0_0_15px_rgba(255,255,255,0.1)]";
                } else {
                     activeTab.className = "platform-tab flex-shrink-0 flex items-center gap-2 px-4 sm:px-5 py-2 rounded-full text-[13px] sm:text-[14px] font-semibold transition-all duration-300 bg-white text-black shadow-[0_0_15px_rgba(255,255,255,0.1)] border-white";
                }
            }

            renderGrid();
        }
    </script>
</body>
</html>
